<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caderno">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Caderno Digital</title>
<style>
:root{--ink:#1d2433;--muted:#667085;--bg:#eef1f5;--panel:#fff;--line:#d9dee7;--accent:#1f3a5f;--sel:#2f7cf6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body.editing{overflow:hidden;position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hidden{display:none!important}

/* ---------- Biblioteca ---------- */
#library{padding:calc(env(safe-area-inset-top) + 22px) 24px 40px;max-width:1200px;margin:0 auto}
.lib-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.lib-head h1{font-size:28px;margin:0;flex:1;min-width:220px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:#b42318;border-color:#f3c3be}
.hint{background:#fff7e6;border:1px solid #f5d9a8;border-radius:12px;padding:10px 14px;margin-bottom:20px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:24px}
.card{display:flex;flex-direction:column;gap:8px}
.cover{aspect-ratio:1/1.35;border-radius:5px 12px 12px 5px;box-shadow:0 6px 16px rgba(20,30,50,.18),inset 9px 0 0 rgba(0,0,0,.13);padding:16px 14px 14px 24px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-align:left;width:100%}
.cover .ttl{font-weight:700;font-size:18px;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.25);word-break:break-word}
.cover .lbl{background:rgba(255,255,255,.92);color:var(--ink);border-radius:6px;padding:5px 8px;font-size:12px}
.meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px}
.more{padding:2px 10px;border-radius:8px;font-size:20px;line-height:1;color:var(--ink)}
.empty{padding:60px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
.lib-foot{margin-top:44px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* ---------- Editor ---------- */
#editor{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);overflow-x:auto;scrollbar-width:none;flex:none}
.bar::-webkit-scrollbar{display:none}
.tb{border-bottom:1px solid var(--line);padding-top:calc(env(safe-area-inset-top) + 6px)}
.pb{border-top:1px solid var(--line);padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}
.ib{min-width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:22px}
.ib svg{width:23px;height:23px}
.ib.on{background:#e3ebf7;color:var(--accent)}
.ib:disabled{opacity:.3}
.sep{width:1px;height:28px;background:var(--line);flex:none;margin:0 4px}
.grp{display:flex;gap:7px;align-items:center;flex:none}
.sw{width:27px;height:27px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2.5px var(--accent)}
.wb{width:36px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;flex:none}
.wb i{display:block;border-radius:50%;background:currentColor}
.wb.on{background:#e3ebf7}
.nbt{font-weight:700;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;padding:0 4px}
.spacer{flex:1;min-width:8px}
#stage{flex:1;overflow:auto;position:relative;touch-action:none}
#sheet{position:relative;margin:16px auto;background:#fff;box-shadow:0 4px 18px rgba(20,30,50,.16)}
#sheet canvas{position:absolute;left:0;top:0;-webkit-user-drag:none}
#selBox{position:absolute;border:1.5px dashed var(--sel);background:rgba(47,124,246,.05);pointer-events:none}
.selbar{position:absolute;left:0;top:-46px;display:flex;gap:4px;pointer-events:auto}
.selbar button{background:var(--ink);color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.pgl{min-width:70px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;flex:none}
.chip{padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;flex:none;white-space:nowrap;height:38px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- Páginas de blocos (fase 2) ---------- */
#docView{flex:1;overflow:auto;background:#fff;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;-webkit-overflow-scrolling:touch}
.doc{max-width:780px;margin:0 auto;padding:44px 24px 45vh 70px;position:relative;font-size:17px;line-height:1.55}
.doc-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px}
.doc-icon{font-size:40px;line-height:1;padding:4px;border-radius:10px;flex:none}
.doc-title{flex:1;font-size:34px;font-weight:800;line-height:1.2;padding-top:4px;min-width:0;word-break:break-word}
[contenteditable]{-webkit-user-select:text;user-select:text;outline:none}
[contenteditable]:empty::before{content:attr(data-ph);color:#b0b7c3;pointer-events:none}
.ce.main:not(:focus):empty::before{content:''}
.blk.t-h1 .ce.main:empty::before,.blk.t-h2 .ce.main:empty::before,.blk.t-h3 .ce.main:empty::before{content:attr(data-ph)}
.blk{position:relative;margin:2px 0}
.hdl{position:absolute;left:-60px;top:2px;display:flex;gap:2px;opacity:0;transition:opacity .15s;-webkit-user-select:none;user-select:none}
.blk:hover>.hdl,.blk:focus-within>.hdl{opacity:.8}
@media (hover:none){.hdl{opacity:.3}.blk:focus-within>.hdl{opacity:.9}}
.hdl button{width:27px;height:28px;border-radius:6px;color:#8a93a3;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
.hdl button:active{background:var(--bg)}
.bc{display:flex;align-items:flex-start;gap:8px;min-height:28px}
.ce.main{flex:1;min-width:0;padding:3px 2px;word-break:break-word}
.t-h1 .ce.main{font-size:28px;font-weight:800;line-height:1.25;margin-top:16px}
.t-h2 .ce.main{font-size:23px;font-weight:750;line-height:1.3;margin-top:12px}
.t-h3 .ce.main{font-size:19px;font-weight:700;margin-top:8px}
.mk{flex:none;min-width:22px;text-align:right;padding-top:3px;color:#475467;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
.t-ul .mk{text-align:center;font-size:20px;line-height:1.3}
.chkb{flex:none;width:21px;height:21px;margin-top:5px;border:2px solid #98a2b3;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;padding:0}
.chkb.on{background:var(--sel);border-color:var(--sel)}
.t-todo.done .ce.main{text-decoration:line-through;color:#98a2b3}
.t-quote .bc{border-left:4px solid var(--ink);padding-left:14px}
.t-callout .bc{background:#f4f6fa;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.emo{flex:none;font-size:22px;line-height:1.2;padding:0 2px}
.t-divider .bc{align-items:center;min-height:30px}
hr.div{border:0;border-top:1px solid #cfd5df;margin:0;width:100%}
.draw{position:relative;width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.draw canvas{display:block;width:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.rsz{height:20px;background:#f4f6fa;border-top:1px solid var(--line);cursor:ns-resize;touch-action:none;display:flex;align-items:center;justify-content:center;color:#98a2b3;font-size:11px;-webkit-user-select:none;user-select:none}
.tblw{width:100%;overflow-x:auto}
.tblw table{border-collapse:collapse;min-width:100%}
.tblw td{border:1px solid #cfd5df;padding:0;vertical-align:top;min-width:90px}
.tblw tr:first-child td{background:#f4f6fa;font-weight:700}
.ce.cell{padding:7px 9px;min-height:36px}
.tbtns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;-webkit-user-select:none;user-select:none}
.tbtns button{font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;color:var(--muted)}
figure.fig{margin:0;width:100%}
figure.fig img{max-width:100%;border-radius:8px;display:block}
.ce.cap{font-size:14px;color:var(--muted);padding:4px 2px}
.plink{display:flex;align-items:center;gap:8px;padding:5px 8px;margin-left:-8px;border-radius:8px;font-weight:600;text-decoration:underline;text-decoration-color:#c3c9d3;text-underline-offset:4px;text-align:left}
.plink:hover,.plink:active{background:var(--bg)}
.plink.gone{color:#98a2b3;text-decoration:line-through}
#slash{position:absolute;left:64px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(20,30,50,.18);width:290px;max-height:330px;overflow:auto;padding:6px;-webkit-user-select:none;user-select:none}
#slash .si{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;font-size:15px}
#slash .si.on{background:#e3ebf7}
#slash .si b{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;background:#fff}
#slash .shd{font-size:11px;color:var(--muted);padding:4px 8px;text-transform:uppercase;letter-spacing:.05em}
#fmt{position:fixed;z-index:40;display:flex;gap:2px;background:var(--ink);border-radius:10px;padding:4px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#fmt button{color:#fff;min-width:36px;height:36px;border-radius:7px;font-size:15px}
#fmt button:active{background:rgba(255,255,255,.18)}
/* Painel lateral de páginas */
#sideOv{position:fixed;inset:0;background:rgba(15,20,30,.3);z-index:30}
#side{position:fixed;left:0;top:0;bottom:0;width:min(330px,86vw);background:#fff;z-index:31;box-shadow:6px 0 24px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px;font-weight:700;font-size:17px}
.tree{flex:1;overflow:auto;padding:4px 8px}
.ti{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 8px;border-radius:8px;font-size:15px;white-space:nowrap;overflow:hidden}
.ti.on{background:#e3ebf7;font-weight:700}
.ti .n{overflow:hidden;text-overflow:ellipsis}
.side-f{display:flex;flex-direction:column;gap:6px;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line)}

/* ---------- Janelas ---------- */
.ov{position:fixed;inset:0;background:rgba(15,20,30,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.mdl{background:#fff;border-radius:16px;padding:20px;width:min(460px,100%);max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mdl.wide{width:min(920px,100%)}
.mdl h2{margin:0 0 14px;font-size:19px}
.mdl p{margin:0;color:var(--muted)}
.mdl label.l{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.mdl input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{border:2px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px;width:88px}
.opt.on{border-color:var(--accent)}
.opt canvas{display:block;width:100%;border:1px solid var(--line);border-radius:3px;margin-bottom:4px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.colors button.on{box-shadow:0 0 0 3px var(--accent)}
.list button{display:block;width:100%;text-align:left;padding:12px 10px;border-radius:10px;font-size:16px}
.list button:active{background:var(--bg)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}
.thumb{text-align:center;font-size:12px;color:var(--muted)}
.thumb canvas{width:100%;display:block;border:1px solid var(--line);border-radius:4px;background:#fff;margin-bottom:4px}
.thumb.on canvas{outline:3px solid var(--accent)}
.chk{display:flex;gap:8px;align-items:center;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 72px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
#print{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print>img{width:210mm;height:297mm;display:block;break-after:page;page-break-after:always}
  #print .pdoc{width:210mm;min-height:297mm;padding:18mm;box-sizing:border-box;break-after:page;page-break-after:always;font:11.5pt/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;color:#111}
  #print .pdoc img{max-width:100%;height:auto;display:block;margin:6px 0}
  #print .pdoc table{border-collapse:collapse;width:100%;margin:6px 0}
  #print .pdoc td{border:1px solid #999;padding:4px 6px;vertical-align:top}
  #print .pdoc .pt{font-size:22pt;font-weight:800;margin:0 0 10pt}
  #print .pdoc .cl{background:#f2f4f7;border-radius:6px;padding:8px 10px;margin:6px 0}
  #print .pdoc blockquote{border-left:3px solid #333;margin:6px 0;padding-left:10px}
  #print .pdoc p,#print .pdoc div{margin:3px 0}
}
</style>
</head>
<body>

<main id="library">
  <div class="lib-head">
    <h1>Os meus cadernos</h1>
    <button class="btn" id="btnRestore">Restaurar cópia</button>
    <button class="btn" id="btnBackup">Cópia de segurança</button>
    <button class="btn primary" id="btnNew">+ Novo caderno</button>
  </div>
  <div class="hint hidden" id="installHint">Para usar como app no iPad: toca em <b>Partilhar</b> → <b>Adicionar ao ecrã principal</b>. Assim abre em ecrã inteiro e funciona sem internet.</div>
  <div id="grid" class="grid"></div>
  <div class="lib-foot"><span id="storageInfo"></span><span>Powered by Claude IA &amp; Ideias&amp;Soltas — concepção de produtos multimédia</span></div>
  <input type="file" id="fileRestore" hidden>
</main>

<section id="editor" class="hidden">
  <div class="bar tb">
    <button class="ib" id="btnBack" title="Voltar aos cadernos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="nbt" id="nbTitle"></span>
    <span class="sep"></span>
    <button class="ib tool" data-tool="pen" title="Caneta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/></svg></button>
    <button class="ib tool" data-tool="hl" title="Marcador"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-5 5h6l2-2"/><path d="M9 14l8.5-8.5 3 3L12 17z"/></svg></button>
    <button class="ib tool" data-tool="eraser" title="Borracha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l9-9 5 5-6 6H8z"/><path d="M9 11l5 5"/><path d="M13 20h7"/></svg></button>
    <button class="ib tool" data-tool="lasso" title="Laço: selecionar e mover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="10" rx="8" ry="5.5" stroke-dasharray="3 2.6"/><path d="M7.5 14.5c-1.5 2 -.5 4 1.5 4s2 2 .5 3"/></svg></button>
    <span class="sep"></span>
    <div class="grp" id="swatches"></div>
    <span class="sep" id="sepW"></span>
    <div class="grp" id="widths"></div>
    <span class="spacer"></span>
    <button class="ib" id="btnUndo" title="Anular"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="ib" id="btnRedo" title="Refazer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
  </div>

  <div id="stage">
    <div id="sheet">
      <canvas id="cBase"></canvas>
      <canvas id="cLive"></canvas>
      <div id="selBox" class="hidden"><div class="selbar"><button data-sel="dup">Duplicar</button><button data-sel="del">Apagar</button></div></div>
    </div>
  </div>
  <div id="docView" class="hidden"><div class="doc" id="doc"></div></div>

  <div class="bar pb">
    <button class="ib" id="btnPrev" title="Página anterior">‹</button>
    <span class="pgl" id="pgLabel"></span>
    <button class="ib" id="btnNext" title="Página seguinte">›</button>
    <button class="chip" id="btnAddPage">+ Página</button>
    <button class="chip" id="btnPages">Páginas</button>
    <button class="chip" id="btnBg">Papel</button>
    <span class="spacer"></span>
    <button class="ib" id="btnZoomOut" title="Afastar">−</button>
    <button class="chip" id="btnFit" title="Ajustar"></button>
    <button class="ib" id="btnZoomIn" title="Aproximar">+</button>
    <span class="sep"></span>
    <button class="chip" id="btnPenOnly" title="Só o lápis escreve; o dedo desloca">✎ Só lápis</button>
    <button class="chip" id="btnMore">Mais ⋯</button>
  </div>
  <div id="sideOv" class="hidden"></div>
  <aside id="side" class="hidden">
    <div class="side-h"><span>Páginas</span><button class="chip" id="btnThumbs">Miniaturas</button></div>
    <div class="tree" id="tree"></div>
    <div class="side-f">
      <button class="btn" id="btnNewDoc">📄 Nova página de blocos</button>
      <button class="btn" id="btnNewInk">📓 Nova página manuscrita</button>
    </div>
  </aside>
</section>

<div id="fmt" class="hidden">
  <button data-f="bold" title="Negrito"><b>N</b></button>
  <button data-f="italic" title="Itálico"><i>I</i></button>
  <button data-f="underline" title="Sublinhado"><u>S</u></button>
  <button data-f="strikeThrough" title="Riscado"><s>R</s></button>
  <button data-f="hl" title="Marcador"><span style="background:#ffe066;color:#1d2433;padding:0 5px;border-radius:3px">A</span></button>
  <button data-f="red" title="Vermelho"><span style="color:#ff7b72;font-weight:800">A</span></button>
  <button data-f="blue" title="Azul"><span style="color:#79b8ff;font-weight:800">A</span></button>
  <button data-f="removeFormat" title="Limpar formatação">⌀</button>
</div>
<input type="file" id="fileImg" accept="image/*" hidden>
<div id="print"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   Caderno Digital — fase 1 (caderno manuscrito) + fase 2 (páginas de blocos)
   Powered by Claude IA & Ideias&Soltas — concepção de produtos multimédia
   ========================================================= */

const PAGE_W = 1000, PAGE_H = 1414;           // proporção A4
const PEN_COLORS = ['#1a1a1a','#1f5fbf','#d0312d','#2e8b57','#7b4fa0','#e8743b'];
const HL_COLORS  = ['#ffe066','#9be89b','#ffb3d1','#9ad7ff','#ffc78a'];
const WIDTHS = { pen:[1.6,3,5.5], hl:[14,22,34], eraser:[8,18,36] };

/* ---------- Armazenamento local (IndexedDB) ---------- */
const DB = (() => {
  let dbp = null, memory = false;
  const mem = { notebooks: new Map(), pages: new Map() };
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(res => {
      let req;
      try { req = indexedDB.open('caderno-digital', 1); } catch (e) { memory = true; return res(null); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('notebooks')) db.createObjectStore('notebooks', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('pages')) db.createObjectStore('pages', { keyPath: 'id' });
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => { memory = true; res(null); };
      req.onblocked = () => { memory = true; res(null); };
    });
    return dbp;
  }
  async function run(store, mode, idbOp, memOp) {
    const db = await open();
    if (!db) return memOp(mem[store]);
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const r = idbOp(t.objectStore(store));
      t.oncomplete = () => res(r.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  return {
    get memory() { return memory; },
    ready: () => open(),
    get: (st, id) => run(st, 'readonly',  s => s.get(id),    m => m.get(id)),
    all: (st)     => run(st, 'readonly',  s => s.getAll(),   m => [...m.values()]),
    put: (st, o)  => run(st, 'readwrite', s => s.put(o),     m => { m.set(o.id, o); }),
    del: (st, id) => run(st, 'readwrite', s => s.delete(id), m => { m.delete(id); }),
  };
})();

/* ---------- Estado ---------- */
const S = {
  nb: null, pages: [], idx: 0,
  tool: 'pen', penColor: PEN_COLORS[1], hlColor: HL_COLORS[0], w: { pen: 1, hl: 1, eraser: 1 },
  penOnly: false, penSeen: false,
  fit: 'width', scale: 1, px: 1,
  hist: new Map(), sel: null, act: null, touches: new Map(),
  dirty: false, dirtyPages: new Set(), saveT: null
};
function loadSettings() {
  try {
    const o = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    for (const k of ['tool','penColor','hlColor','w','penOnly','penSeen','fit']) if (k in o) S[k] = o[k];
  } catch (e) {}
  if (!['pen','hl','eraser'].includes(S.tool)) S.tool = 'pen';
  if (!['width','page'].includes(S.fit)) S.fit = 'width';
}
function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      tool: S.tool === 'lasso' ? 'pen' : S.tool, penColor: S.penColor, hlColor: S.hlColor, w: S.w,
      penOnly: S.penOnly, penSeen: S.penSeen, fit: S.fit === 'custom' ? 'width' : S.fit }));
  } catch (e) {}
}
const page = () => S.pages[S.idx];
const newPage = (nbId, bg) => ({ id: uid(), nb: nbId, kind: 'ink', parent: null, bg: bg || 'pautado', strokes: [] });
const newDoc = (nbId, parent) => ({ id: uid(), nb: nbId, kind: 'doc', parent: parent || null, title: '', icon: '📄', blocks: [{ id: uid(), type: 'p', html: '' }] });
const isDoc = () => !!(S.nb && page() && page().kind === 'doc');
const pageName = p => p.kind === 'doc' ? (p.title || 'Sem título') : (p.title || `Página ${S.pages.indexOf(p) + 1}`);
function depthOf(p) {
  let d = 0, q = p; const seen = new Set();
  while (q && q.parent && !seen.has(q.parent)) { seen.add(q.parent); q = S.pages.find(x => x.id === q.parent); if (!q) break; d++; }
  return d;
}
function subtreeEnd(i) {                 // posição a seguir à página i e a todas as suas subpáginas
  const d = depthOf(S.pages[i]); let j = i + 1;
  while (j < S.pages.length && depthOf(S.pages[j]) > d) j++;
  return j;
}

/* ---------- Utilitários de interface ---------- */
function toast(msg, ms = 2800) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
function modal(html, mount, cls = '') {
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = `<div class="mdl ${cls}">${html}</div>`;
    document.body.appendChild(ov);
    let done = false;
    const close = v => { if (done) return; done = true; ov.remove(); res(v); };
    ov.addEventListener('click', e => { if (e.target === ov) close(null); });
    ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => close(null)));
    if (mount) mount(ov.firstElementChild, close);
  });
}
function askText(title, value = '', ok = 'Guardar') {
  return modal(`<h2>${esc(title)}</h2><input type="text" id="mIn" value="${esc(value)}" maxlength="80">
    <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="mOk">${esc(ok)}</button></div>`,
    (m, close) => {
      const i = m.querySelector('#mIn'); setTimeout(() => { i.focus(); i.select(); }, 60);
      const go = () => { const v = i.value.trim(); if (v) close(v); };
      m.querySelector('#mOk').onclick = go; i.onkeydown = e => { if (e.key === 'Enter') go(); };
    });
}
function confirmBox(title, msg, ok = 'Apagar', danger = true) {

    <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" id="mOk">${esc(ok)}</button></div>`,
    (m, close) => { m.querySelector('#mOk').onclick = () => close(true); }).then(v => !!v);
}
function actionSheet(title, items) {
  return modal(`<h2>${esc(title)}</h2><div class="list">${items.map((it, i) =>
      `<button data-i="${i}"${it.danger ? ' style="color:#b42318"' : ''}>${esc(it.label)}</button>`).join('')}</div>
    <div class="acts"><button class="btn" data-close>Fechar</button></div>`,
    (m, close) => m.querySelectorAll('.list button').forEach(b => b.onclick = () => close(items[+b.dataset.i].value)));

/* ---------- Desenho: papel e traços ---------- */
function drawBackground(ctx, bg, W = PAGE_W, H = PAGE_H, block = false) {
  ctx.save();
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  const step = 34;
  if (bg === 'pautado') {
    ctx.strokeStyle = '#bcd0ea'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (let y = block ? step : 112; y < H - (block ? 4 : 30); y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    if (!block) { ctx.strokeStyle = '#f2a7a7'; ctx.beginPath(); ctx.moveTo(92, 0); ctx.lineTo(92, H); ctx.stroke(); }
  } else if (bg === 'quadriculado') {
    ctx.strokeStyle = '#d3deec'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = step; x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = step; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  } else if (bg === 'pontilhado') {
    ctx.fillStyle = '#a9b6c8';
    for (let x = step; x < W; x += step)
      for (let y = step; y < H; y += step) { ctx.beginPath(); ctx.arc(x, y, 1.7, 0, 7); ctx.fill(); }
  }
  ctx.restore();
}
const wAt = (s, pr) => s.w * (0.35 + 1.15 * pr);
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
function seg(ctx, s, p, i) {
  const a = p[i - 1], b = p[i];
  const m1 = i === 1 ? a : mid(p[i - 2], a), m2 = mid(a, b);
  ctx.lineWidth = wAt(s, (a[2] + b[2]) / 2);
  ctx.beginPath(); ctx.moveTo(m1[0], m1[1]); ctx.quadraticCurveTo(a[0], a[1], m2[0], m2[1]); ctx.stroke();
}
function drawStroke(ctx, s, dx = 0, dy = 0) {
  const p = s.pts; if (!p.length) return;
  ctx.save(); ctx.translate(dx, dy);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
  if (s.tool === 'hl') {
    ctx.globalAlpha = 0.42; ctx.globalCompositeOperation = 'multiply'; ctx.lineWidth = s.w;
    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    if (p.length === 1) ctx.lineTo(p[0][0] + 0.1, p[0][1]);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
    ctx.stroke();
  } else if (p.length === 1) {
    ctx.beginPath(); ctx.arc(p[0][0], p[0][1], wAt(s, p[0][2]) / 2, 0, 7); ctx.fill();
  } else {
    for (let i = 1; i < p.length; i++) seg(ctx, s, p, i);
    const a = p[p.length - 2], b = p[p.length - 1], m = mid(a, b);
    ctx.lineWidth = wAt(s, b[2]); ctx.beginPath(); ctx.moveTo(m[0], m[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  ctx.restore();
}
function renderPageTo(c, p) {
  const x = c.getContext('2d');
  x.setTransform(c.width / PAGE_W, 0, 0, c.height / PAGE_H, 0, 0);
  if (p.kind === 'doc') return renderDocThumb(x, p);
  drawBackground(x, p.bg);
  p.strokes.forEach(s => drawStroke(x, s));
}
function renderDocThumb(x, p) {
  x.fillStyle = '#fff'; x.fillRect(0, 0, PAGE_W, PAGE_H);
  x.fillStyle = '#1d2433'; x.font = '800 64px -apple-system, "Segoe UI", sans-serif';
  x.fillText(((p.icon || '📄') + ' ' + (p.title || 'Sem título')).slice(0, 24), 70, 150);
  let y = 250;
  for (const b of p.blocks || []) {
    if (y > PAGE_H - 60) break;
    if (b.type === 'draw' || b.type === 'img' || b.type === 'table') {
      const h = b.type === 'draw' ? Math.min(b.h * 0.86, 420) : 220;
      x.fillStyle = '#e9edf3'; x.fillRect(70, y - 30, 860, h); y += h + 34; continue;
    }
    if (b.type === 'divider') { x.fillStyle = '#d9dee7'; x.fillRect(70, y - 20, 860, 3); y += 40; continue; }
    let t = plainText(b.html || '');
    if (b.type === 'link') { const q = S.pages.find(z => z.id === b.target); t = '↗ ' + (q ? pageName(q) : ''); }
    const big = /^h\d$/.test(b.type);
    x.font = `${big ? '700 46px' : '34px'} -apple-system, "Segoe UI", sans-serif`; x.fillStyle = '#475467';
    x.fillText(t.slice(0, big ? 34 : 52), 70, y); y += big ? 80 : 56;
  }
}
function plainText(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent; }

/* ---------- Geometria ---------- */
const bbCache = new WeakMap();
function bbox(s) {
  let b = bbCache.get(s); if (b) return b;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const q of s.pts) { if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }
  const pad = s.tool === 'hl' ? s.w / 2 : wAt(s, 1) / 2;
  b = { x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad };
  bbCache.set(s, b); return b;
}
function unionBox(list) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const s of list) { const b = bbox(s); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); }
  return { x: x0 - 6, y: y0 - 6, w: x1 - x0 + 12, h: y1 - y0 + 12 };
}
function distSeg(x, y, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy;
  let t = l ? ((x - a[0]) * dx + (y - a[1]) * dy) / l : 0; t = clamp(t, 0, 1);
  return Math.hypot(x - (a[0] + t * dx), y - (a[1] + t * dy));
}
function strokeHit(s, x, y, r) {
  const b = bbox(s);
  if (x < b.x - r || x > b.x + b.w + r || y < b.y - r || y > b.y + b.h + r) return false;
  const p = s.pts, lim = r + (s.tool === 'hl' ? s.w / 2 : wAt(s, 1) / 2);
  if (p.length === 1) return Math.hypot(p[0][0] - x, p[0][1] - y) <= lim;
  for (let i = 1; i < p.length; i++) if (distSeg(x, y, p[i - 1], p[i]) <= lim) return true;
  return false;
}
function pip(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const inBox = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
const moved = (s, dx, dy, newId) => ({ ...s, id: newId ? uid() : s.id, pts: s.pts.map(q => [r1(q[0] + dx), r1(q[1] + dy), q[2]]) });

/* ---------- Tela (canvas) e zoom ---------- */
const stage = $('#stage'), sheet = $('#sheet'), cBase = $('#cBase'), cLive = $('#cLive');
function ctxOf(c) { const x = c.getContext('2d'); x.setTransform(S.px, 0, 0, S.px, 0, 0); return x; }
function clearCtx(c) { const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height); x.setTransform(S.px, 0, 0, S.px, 0, 0); return x; }
function redrawBase(except) {
  const pg = page(); if (!pg || pg.kind === 'doc') return;
  const x = clearCtx(cBase);
  drawBackground(x, pg.bg);
  for (const s of pg.strokes) if (!except || !except.has(s.id)) drawStroke(x, s);
}
function layout() {
  if (!S.nb || isDoc()) return;
  if (S.act) cancelAct();
  const sw = stage.clientWidth, sh = stage.clientHeight;
  let sc = S.scale;
  if (S.fit === 'width') sc = (sw - 32) / PAGE_W;
  else if (S.fit === 'page') sc = Math.min((sw - 32) / PAGE_W, (sh - 32) / PAGE_H);
  sc = clamp(sc, 0.25, 4); S.scale = sc;
  const cssW = PAGE_W * sc, cssH = PAGE_H * sc;
  let dpr = window.devicePixelRatio || 1;
  const maxPx = 12e6;                                  // limite de memória do Safari para canvas
  if (cssW * cssH * dpr * dpr > maxPx) dpr = Math.sqrt(maxPx / (cssW * cssH));
  S.px = sc * dpr;
  for (const c of [cBase, cLive]) {
    c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr);
    c.style.width = cssW + 'px'; c.style.height = cssH + 'px';
  }
  sheet.style.width = cssW + 'px'; sheet.style.height = cssH + 'px';
  redrawBase(); showSel(); updateFitLabel();
}
function zoomTo(sc) {
  const cx = (stage.scrollLeft + stage.clientWidth / 2 - sheet.offsetLeft) / S.scale;
  const cy = (stage.scrollTop + stage.clientHeight / 2 - sheet.offsetTop) / S.scale;
  S.fit = 'custom'; S.scale = clamp(sc, 0.25, 4); layout();
  stage.scrollLeft = cx * S.scale + sheet.offsetLeft - stage.clientWidth / 2;
  stage.scrollTop = cy * S.scale + sheet.offsetTop - stage.clientHeight / 2;
}
function updateFitLabel() {
  $('#btnFit').textContent = S.fit === 'width' ? 'Largura' : S.fit === 'page' ? 'Página inteira' : Math.round(S.scale * 100) + '%';
}

/* ---------- Seleção (laço) ---------- */
function showSel() {
  const b = $('#selBox');
  if (!S.sel) { b.classList.add('hidden'); return; }
  const bx = S.sel.box;
  Object.assign(b.style, { left: bx.x * S.scale + 'px', top: bx.y * S.scale + 'px', width: bx.w * S.scale + 'px', height: bx.h * S.scale + 'px' });
  b.classList.remove('hidden');
}
function clearSel() { S.sel = null; showSel(); }
function selectPoly(poly) {
  if (poly.length < 3) return;
  const pg = page(), ids = new Set();
  for (const s of pg.strokes) {
    let inside = 0; for (const q of s.pts) if (pip(q[0], q[1], poly)) inside++;
    if (inside && inside >= s.pts.length * 0.5) ids.add(s.id);
  }
  if (!ids.size) return;
  S.sel = { ids, box: unionBox(pg.strokes.filter(s => ids.has(s.id))) };
  showSel();
}
function drawSelLive(dx, dy) {
  const x = clearCtx(cLive);
  for (const s of page().strokes) if (S.sel.ids.has(s.id)) drawStroke(x, s, dx, dy);
  const b = S.sel.box;
  x.save(); x.strokeStyle = '#2f7cf6'; x.lineWidth = 1.5 / S.scale; x.setLineDash([6 / S.scale, 5 / S.scale]);
  x.strokeRect(b.x + dx, b.y + dy, b.w, b.h); x.restore();
}
function drawLasso(poly) {
  const x = clearCtx(cLive);
  x.save(); x.strokeStyle = '#2f7cf6'; x.lineWidth = 1.6 / S.scale; x.setLineDash([6 / S.scale, 5 / S.scale]);
  x.beginPath(); poly.forEach((q, i) => i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1])); x.closePath(); x.stroke(); x.restore();
}
function selAction(kind) {
  if (!S.sel) return;
  const pg = page();
  pushHist(pg.strokes);
  if (kind === 'del') {
    pg.strokes = pg.strokes.filter(s => !S.sel.ids.has(s.id)); clearSel();
  } else if (kind === 'dup') {
    const copies = pg.strokes.filter(s => S.sel.ids.has(s.id)).map(s => moved(s, 24, 24, true));
    pg.strokes = pg.strokes.concat(copies);
    S.sel = { ids: new Set(copies.map(s => s.id)), box: unionBox(copies) }; showSel();
  }
  redrawBase(); markDirty(); updateUndo();
}

/* ---------- Anular / refazer ---------- */
function hist() { const id = page().id; if (!S.hist.has(id)) S.hist.set(id, { u: [], r: [] }); return S.hist.get(id); }
function pushHist(prev) { const h = hist(); h.u.push(prev); if (h.u.length > 80) h.u.shift(); h.r.length = 0; }
function undo() {
  if (S.act || D.act) return; const h = hist(); if (!h.u.length) return;
  if (isDoc()) { h.r.push(snap(page())); unsnap(page(), h.u.pop()); return afterDocEdit(); }
  h.r.push(page().strokes); page().strokes = h.u.pop(); afterEdit();
}
function redo() {
  if (S.act || D.act) return; const h = hist(); if (!h.r.length) return;
  if (isDoc()) { h.u.push(snap(page())); unsnap(page(), h.r.pop()); return afterDocEdit(); }
  h.u.push(page().strokes); page().strokes = h.r.pop(); afterEdit();
}
function afterEdit() { clearSel(); redrawBase(); markDirty(); updateUndo(); }
function updateUndo() { if (!S.nb) return; const h = hist(); $('#btnUndo').disabled = !h.u.length; $('#btnRedo').disabled = !h.r.length; }

/* ---------- Lápis, dedo e rato ---------- */
function pagePt(e, rect) { return [(e.clientX - rect.left) / S.scale, (e.clientY - rect.top) / S.scale]; }
function pressureOf(e) { if (e.pointerType !== 'pen') return 0.5; return e.pressure > 0 ? e.pressure : 0.5; }

function onDown(e) {
  if (!S.nb || e.target.closest('.selbar')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  if (e.pointerType === 'pen' && !S.penSeen) {
    S.penSeen = true; S.penOnly = true; saveSettings(); updatePenBtn();
    toast('Apple Pencil detetado: o lápis escreve e o dedo desloca a página.', 4000);
  }
  if (e.pointerType === 'touch') {
    S.touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (S.act && S.act.pointerType === 'touch') { cancelAct(); return; }   // 2.º dedo: passa a deslocar
    if (S.penOnly || S.touches.size > 1) return;
  }
  if (S.act) return;
  startAct(e);
}
function startAct(e) {
  const pg = page(), rect = sheet.getBoundingClientRect();
  const [x, y] = pagePt(e, rect);
  if (x < -10 || y < -10 || x > PAGE_W + 10 || y > PAGE_H + 10) return false;
  const a = { id: e.pointerId, pointerType: e.pointerType, tool: S.tool, rect };
  if (S.tool === 'pen' || S.tool === 'hl') {
    clearSel();
    a.s = { id: uid(), tool: S.tool, color: S.tool === 'pen' ? S.penColor : S.hlColor, w: WIDTHS[S.tool][S.w[S.tool]], pts: [] };
    a.lastP = pressureOf(e);
    S.act = a; addPt(a, x, y, a.lastP, true);
  } else if (S.tool === 'eraser') {
    clearSel();
    a.before = pg.strokes; a.r = WIDTHS.eraser[S.w.eraser];
    S.act = a; stepAct(a, x, y, e); renderAct(a);
  } else if (S.tool === 'lasso') {
    if (S.sel && inBox(S.sel.box, x, y)) {
      Object.assign(a, { mode: 'drag', x0: x, y0: y, dx: 0, dy: 0 });
      S.act = a; redrawBase(S.sel.ids); $('#selBox').classList.add('hidden'); drawSelLive(0, 0);

    }

}
function addPt(a, x, y, raw, first) {
  const p = a.s.pts;
  const pr = first ? raw : a.lastP * 0.55 + raw * 0.45; a.lastP = pr;
  const q = [r1(x), r1(y), Math.round(pr * 100) / 100];
  if (p.length) { const l = p[p.length - 1]; if (Math.hypot(q[0] - l[0], q[1] - l[1]) < 0.7) return; }
  p.push(q);
  if (a.s.tool === 'hl') { drawStroke(clearCtx(cLive), a.s); return; }
  const x2 = ctxOf(cLive);
  x2.save(); x2.lineCap = 'round'; x2.strokeStyle = a.s.color; x2.fillStyle = a.s.color;
  if (p.length === 1) { x2.beginPath(); x2.arc(q[0], q[1], wAt(a.s, q[2]) / 2, 0, 7); x2.fill(); }

}
function stepAct(a, x, y, ev) {

  }

}
function renderAct(a) {

    const x = clearCtx(cLive);
    x.save(); x.strokeStyle = 'rgba(80,90,110,.7)'; x.lineWidth = 1.2 / S.scale;
    x.beginPath(); x.arc(a.cx, a.cy, a.r, 0, 7); x.stroke(); x.restore();

}
function onMove(e) {
  const a = S.act;
  if (a && a.id === e.pointerId) {
    e.preventDefault();
    const co = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    const list = co && co.length ? co : [e];
    for (const ev of list) { const [x, y] = pagePt(ev, a.rect); stepAct(a, x, y, ev); }
    renderAct(a);
    return;
  }

    e.preventDefault();

    t.x = e.clientX; t.y = e.clientY;

}
function onUp(e) {

  const pg = page();
  clearCtx(cLive);
  if (a.s) {
    if (a.s.pts.length) {
      pushHist(pg.strokes); pg.strokes = pg.strokes.concat([a.s]);

    }
  } else if (a.tool === 'eraser') {

  } else if (a.mode === 'lasso') {

  } else if (a.mode === 'drag') {
    if (Math.abs(a.dx) + Math.abs(a.dy) > 0.5) {
      pushHist(pg.strokes);
      pg.strokes = pg.strokes.map(s => S.sel.ids.has(s.id) ? moved(s, a.dx, a.dy) : s);
      S.sel.box = { ...S.sel.box, x: S.sel.box.x + a.dx, y: S.sel.box.y + a.dy };

  }

}
function onCancel(e) {

}
function cancelAct() {
  const a = S.act; S.act = null; if (!a) return;
  clearCtx(cLive);

}
stage.addEventListener('pointerdown', onDown);
stage.addEventListener('pointermove', onMove);
stage.addEventListener('pointerup', onUp);

/* ---------- Gravação automática ---------- */
function markDirty(id = page() && page().id) {
  if (id) S.dirtyPages.add(id);
  S.dirty = true;
  clearTimeout(S.saveT); S.saveT = setTimeout(flush, 600);
}
async function flush() {
  clearTimeout(S.saveT);
  if (!S.dirty || !S.nb) return;
  S.dirty = false;
  const ids = [...S.dirtyPages]; S.dirtyPages.clear();
  try {
    for (const id of ids) { const p = S.pages.find(x => x.id === id); if (p) await DB.put('pages', p); }
    S.nb.updated = Date.now(); S.nb.lastPage = S.idx; S.nb.pages = S.pages.map(p => p.id);
    await DB.put('notebooks', S.nb);
  } catch (err) {
    ids.forEach(id => S.dirtyPages.add(id)); S.dirty = true;
    toast('Não foi possível guardar. Verifica o espaço livre no iPad.', 5000);
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', flush);

/* ---------- Editor: abrir, páginas, ferramentas ---------- */
async function openNotebook(id) {
  const nb = await DB.get('notebooks', id); if (!nb) return;
  const pages = [];
  for (const pid of nb.pages || []) { const p = await DB.get('pages', pid); if (p) pages.push(p); }
  if (!pages.length) { const p = newPage(nb.id, nb.bg); pages.push(p); await DB.put('pages', p); }
  pages.forEach(p => { if (!p.kind) p.kind = 'ink'; if (p.parent === undefined) p.parent = null; });
  nb.pages = pages.map(p => p.id);
  Object.assign(S, { nb, pages, idx: clamp(nb.lastPage || 0, 0, pages.length - 1), sel: null, act: null });
  S.hist.clear(); S.touches.clear();
  $('#library').classList.add('hidden'); $('#editor').classList.remove('hidden'); document.body.classList.add('editing');
  $('#nbTitle').textContent = nb.title;
  updatePenBtn();
  showView(); updatePage();
}
function showView() {                     // mostra a página atual: manuscrita ou de blocos
  const doc = isDoc();
  if (S.act) cancelAct();
  if (D.act) drawAbort();
  closeSlash(); hideFmt();
  $('#stage').classList.toggle('hidden', doc);
  $('#docView').classList.toggle('hidden', !doc);
  document.querySelector('[data-tool=lasso]').classList.toggle('hidden', doc);
  ['#btnBg', '#btnZoomOut', '#btnFit', '#btnZoomIn'].forEach(s => $(s).classList.toggle('hidden', doc));
  if (doc && S.tool === 'lasso') S.tool = 'pen';
  renderTools();
  if (doc) { renderDoc(); docView.scrollTop = 0; }
  else { clearSel(); layout(); stage.scrollTop = 0; }
  renderTree();
}
async function closeNotebook() {
  if (S.act) cancelAct();
  if (D.act) drawAbort();
  closeSlash(); hideFmt(); closeSide();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  await flush();
  S.nb = null; S.pages = [];
  $('#editor').classList.add('hidden'); $('#library').classList.remove('hidden'); document.body.classList.remove('editing');
  renderLibrary();
}
function updatePage() {
  $('#pgLabel').textContent = `${S.idx + 1} / ${S.pages.length}`;
  $('#btnPrev').disabled = S.idx === 0;
  $('#btnNext').disabled = S.idx === S.pages.length - 1;
  updateUndo();
}
function goPage(i) {
  if (i < 0 || i >= S.pages.length) return;
  if (document.activeElement && document.activeElement.isContentEditable) document.activeElement.blur();
  S.idx = i; showView(); updatePage(); markDirty(null);
}
function addPage(kind) {                  // nova página do mesmo tipo da atual, logo a seguir (mesmo nível)
  const cur = page();
  if (kind !== 'doc' && kind !== 'ink') kind = cur ? cur.kind : 'ink';
  const p = kind === 'doc' ? newDoc(S.nb.id) : newPage(S.nb.id, cur && cur.kind === 'ink' ? cur.bg : (S.nb.bg || 'pautado'));
  p.parent = cur ? cur.parent || null : null;
  const at = S.pages.length ? subtreeEnd(S.idx) : 0;
  S.pages.splice(at, 0, p);
  markDirty(p.id); goPage(at); toast('Página adicionada');
}
async function deletePage() {
  const cur = page(), n = subtreeEnd(S.idx) - S.idx;
  if (S.pages.length === 1) {
    if (!await confirmBox('Limpar página', 'É a única página do caderno. Queres apagar todo o conteúdo dela?', 'Limpar')) return;
    if (cur.kind === 'doc') { pushHist(snap(cur)); cur.blocks = [{ id: uid(), type: 'p', html: '' }]; afterDocEdit(); }
    else { pushHist(cur.strokes); cur.strokes = []; afterEdit(); }
    return;
  }
  const extra = n > 1 ? ` e as suas ${n - 1} subpágina(s)` : '';
  if (!await confirmBox('Apagar página', `Apagar «${pageName(cur)}»${extra}? Esta ação não pode ser anulada.`)) return;
  const removed = S.pages.splice(S.idx, n);
  for (const p of removed) { S.hist.delete(p.id); S.dirtyPages.delete(p.id); try { await DB.del('pages', p.id); } catch (_) {} }
  if (!S.pages.length) { const p = cur.kind === 'doc' ? newDoc(S.nb.id) : newPage(S.nb.id, S.nb.bg); S.pages.push(p); markDirty(p.id); }
  S.idx = Math.min(S.idx, S.pages.length - 1);
  showView(); updatePage(); markDirty(null); await flush();
}
function renderTools() {
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.tool === S.tool));
  const t = S.tool, sw = $('#swatches'), wd = $('#widths');

/* ---------- Exportar ---------- */
function pageCanvas(p, k) { const c = document.createElement('canvas'); c.width = PAGE_W * k; c.height = PAGE_H * k; renderPageTo(c, p); return c; }
async function shareBlob(blob, name) {
  const f = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function exportPng() {
  pageCanvas(page(), 2).toBlob(b => shareBlob(b, `${safeName(S.nb.title)}-pag${S.idx + 1}.png`), 'image/png');
}
async function exportPdf(list) {
  if (!Array.isArray(list)) list = S.pages;
  await flush();
  toast('A preparar o PDF…');
  const box = $('#print'); box.innerHTML = '';
  for (const p of list) {
    if (p.kind === 'doc') box.appendChild(docPrintNode(p));
    else { const img = new Image(); img.src = pageCanvas(p, 1.6).toDataURL('image/jpeg', 0.92); box.appendChild(img); }
    await new Promise(r => setTimeout(r));
  }
  await Promise.all([...box.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : null));
  toast('No painel de impressão, usa «Partilhar» para guardar como PDF.', 6000);
  setTimeout(() => window.print(), 150);
}

/* ---------- Cópia de segurança ---------- */
async function backup() {
  const notebooks = await DB.all('notebooks'), pages = await DB.all('pages');
  if (!notebooks.length) { toast('Ainda não há cadernos para copiar.'); return; }
  const data = { app: 'caderno-digital', versao: 1, exportado: new Date().toISOString(), notebooks, pages };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  await shareBlob(blob, `cadernos-copia-${new Date().toISOString().slice(0, 10)}.json`);
}
async function restore(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('Ficheiro inválido.'); return; }
  if (!data || data.app !== 'caderno-digital' || !Array.isArray(data.notebooks)) { toast('Este ficheiro não é uma cópia do Caderno Digital.'); return; }
  if (!await confirmBox('Restaurar cópia', `Restaurar ${data.notebooks.length} caderno(s)? Os cadernos com o mesmo identificador são substituídos; os restantes ficam intactos.`, 'Restaurar', false)) return;

      walk(c);

        c.replaceWith(...c.childNodes); continue;

$('#btnFit').onclick = () => { S.fit = S.fit === 'width' ? 'page' : 'width'; saveSettings(); layout(); };
$('#btnPenOnly').onclick = () => {
  S.penOnly = !S.penOnly; saveSettings(); updatePenBtn();
  toast(S.penOnly ? 'Só o lápis escreve. O dedo desloca a página.' : 'O dedo também escreve. Usa dois dedos para deslocar.');
};
document.addEventListener('keydown', e => {
  if (!S.nb || document.querySelector('.ov') || e.target.matches('input')) return;
  const k = (e.key || '').toLowerCase(), undoKey = (e.metaKey || e.ctrlKey) && k === 'z';
  if (undoKey) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (e.target.isContentEditable || isDoc()) return;
  if (k === 'arrowright' || k === 'pagedown') goPage(S.idx + 1);
  else if (k === 'arrowleft' || k === 'pageup') goPage(S.idx - 1);
  else if (k === 'p') { S.tool = 'pen'; renderTools(); }
  else if (k === 'm') { S.tool = 'hl'; renderTools(); }
  else if (k === 'e') { S.tool = 'eraser'; renderTools(); }
  else if (k === 'l') { S.tool = 'lasso'; renderTools(); }
});
let rzRaf = 0;
new ResizeObserver(() => {
  if (!S.nb || S.fit === 'custom') return;
  cancelAnimationFrame(rzRaf); rzRaf = requestAnimationFrame(layout);
}).observe(stage);

/* ---------- Arranque ---------- */
(async function init() {
  loadSettings();
  await DB.ready();
  const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && !standalone) $('#installHint').classList.remove('hidden');
  requestPersist();
  renderLibrary();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
